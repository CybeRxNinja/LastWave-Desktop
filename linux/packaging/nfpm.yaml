# LastWave — Linux system packages (deb + rpm + arch) via nFPM.
# Built ONLY for releases (v* tags); see .github/workflows/desktop.yml.
# VERSION comes from the tag (v1.0.0 -> 1.0.0); nFPM expands env vars.
name: lastwave-desktop
arch: amd64
platform: linux
version: ${VERSION}
section: sound
priority: optional
maintainer: Clash-Projects <https://github.com/Clash-Projects/LastWave-Desktop>
description: |-
  LastWave — desktop music player: YouTube Music, lossless audio,
  word-synced lyrics and Last.fm scrobbling.
vendor: Clash-Projects
homepage: https://github.com/Clash-Projects/LastWave-Desktop
license: Proprietary — all rights reserved (no LICENSE file yet)

contents:
  # Release bundle straight into /opt.
  - src: build/linux/x64/release/bundle
    dst: /opt/lastwave
    type: tree
  # CLI entry point.
  - src: /opt/lastwave/lastwave_desktop
    dst: /usr/bin/lastwave
    type: symlink
  # Desktop integration.
  - src: linux/packaging/lastwave.desktop
    dst: /usr/share/applications/lastwave.desktop
  - src: lastwave-logo.png
    dst: /usr/share/icons/hicolor/512x512/apps/lastwave.png

overrides:
  deb:
    depends:
      - libgtk-3-0
      - libwebkit2gtk-4.1-0
      - libayatana-appindicator3-1 | libappindicator3-1
      - libasound2
      - libmpv2
  rpm:
    depends:
      - gtk3
      - webkit2gtk4.1
      - libappindicator-gtk3
      - alsa-lib
      - mpv-libs
  # The packager key is `archlinux`, NOT `arch`: every overrides key is
  # validated against the registered packager names (Config.Validate ->
  # Get()), and `arch` is not one of them, so an `arch:` block fails the
  # whole run. Same reason the CLI flag is `--packager archlinux`.
  #
  # pacman resolves against Arch package names, and none of the deb/rpm
  # spellings above exist in the Arch repos — every name below was
  # checked against archlinux.org/packages/search (all in `extra`):
  #
  #   gtk3                     provides libgtk-3.so.0
  #       -> GTK is a hard build dep of the runner:
  #          linux/CMakeLists.txt:55 pkg_check_modules(GTK ... gtk+-3.0)
  #          and the CI apt list installs libgtk-3-dev (desktop.yml).
  #   webkit2gtk-4.1           provides libwebkit2gtk-4.1.so.0
  #       -> desktop_webview_window plugin (pubspec.yaml:76) links the
  #          4.1 API; CI installs libwebkit2gtk-4.1-dev (desktop.yml).
  #          (Plain `webkit2gtk` is the 4.0 build — wrong ABI here.)
  #   libayatana-appindicator  tray_menu.so, pulled in by tray_manager
  #       (pubspec.yaml:56); CI installs libayatana-appindicator3-dev
  #       (desktop.yml). Depends gtk3 itself, so it transitively covers
  #       the appindicator + dbusmenu stack.
  #   alsa-lib                 provides libasound.so.2 — the default ALSA
  #       output of the media_kit pipeline (pubspec.yaml:51);
  #       CI installs libasound2-dev (desktop.yml).
  #   mpv                      provides libmpv.so.2 — the SONAME the
  #       media_kit_* plugins are normalized to in the "Normalize libmpv
  #       linkage" step of desktop.yml (patchelf .so.1 -> .so.2). Arch
  #       has NO `mpv-libs` split package (the rpm spelling) and no
  #       `libmpv` package, so `mpv` is the only correct name; its
  #       bundled codecs/ffmpeg/deps come in transitively.
  #   libkeybinder3              provides usr/lib/libkeybinder-3.0.so.0,
  #       linked directly by the lastwave-desktop executable. A stock Arch
  #       box without it dies before main() with "error while loading
  #       shared libraries: libkeybinder-3.0.so.0". CI installs the
  #       matching libkeybinder-3.0-dev (desktop.yml), so deb/rpm pulled
  #       it in transitively and Arch was the only list missing it.
  #       The name is `libkeybinder3`, NOT the library spelling
  #       `keybinder`: that name does not exist, so
  #       `pacman -U lastwave-desktop-1.0.0-1-x86_64.pkg.tar.zst` failed
  #       with `warning: cannot resolve "keybinder", a dependency of
  #       "lastwave-desktop"`. Checked against the official repos:
  #       archlinux.org/packages/extra/x86_64/libkeybinder3/ is the only
  #       hit for the search json `?q=keybinder` (extra/libkeybinder3
  #       0.3.2-5, and its /files/ listing ships
  #       usr/lib/libkeybinder-3.0.so.0), and there is no AUR fallback
  #       (aur.archlinux.org/rpc/v5/info?arg[]=libkeybinder3 returns
  #       resultcount 0), so the dependency is satisfiable only under
  #       this exact name.
  #
  # Deliberately NOT listed:
  #   vulkan-icd-loader — already an explicit dependency of Arch's `mpv`
  #       package, so declaring it here would be redundant.
  archlinux:
    depends:
      - gtk3
      - webkit2gtk-4.1
      - libayatana-appindicator
      - alsa-lib
      - mpv
      - libkeybinder3
