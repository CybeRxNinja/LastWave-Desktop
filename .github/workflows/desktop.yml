name: Build and Release Desktop Apps

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths-ignore:
      - '**.md'
      - '**.yml'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '**.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux Bundle
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config patchelf binutils \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libayatana-appindicator3-dev libasound2-dev libmpv-dev mpv \
            libkeybinder-3.0-dev libwebkit2gtk-4.1-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Release builds need the addon backend key: CI has no .env
      # (gitignored), so the repo secret ADDON_CLIENT_SECRET is written
      # to .env here. GitHub masks the value in logs; when unset the
      # key stays empty and addon calls fail closed server-side.
      # (Last.fm is BYOK and LYRICS_API_KEY is unused — nothing else
      # needs injecting.)
      - name: Write .env from secrets
        run: echo "ADDON_CLIENT_SECRET=${{ secrets.ADDON_CLIENT_SECRET }}" > .env

      - name: Generate Obfuscated Secrets
        run: dart tool/obfuscate_secrets.dart

      - name: Install dependencies
        run: flutter pub get

      # - name: Run analyzer & tests
      #   run: |
      #     flutter analyze --no-fatal-infos
      #     flutter test

      - name: Build Linux app
        run: flutter build linux --release

      # Ubuntu 22.04 ships mpv 0.34 whose SONAME is libmpv.so.1, so the
      # source-built media_kit plugins record NEEDED libmpv.so.1 — which
      # exists on NO modern distro (24.04+, Fedora, Arch ship only
      # .so.2) and the loader dies before main(). Retarget the two
      # shims to .so.2: ABI-safe, they use only stable render/event
      # APIs present in .so.2 (verified against mpv 0.41), and Dart's
      # own loader already prefers .so.2. Fails the job if .so.1
      # survives. (22.04 itself has no .so.2 — see release notes.)
      - name: Normalize libmpv linkage
        run: |
          BUNDLE="build/linux/x64/release/bundle/lib"
          for f in "$BUNDLE"/libmedia_kit_video_plugin.so "$BUNDLE"/libmedia_kit_native_event_loop.so; do
            if objdump -p "$f" | grep -q "NEEDED.*libmpv.so.1"; then
              echo "Retargeting $f: libmpv.so.1 -> libmpv.so.2"
              patchelf --replace-needed libmpv.so.1 libmpv.so.2 "$f"
            fi
          done
          echo "--- NEEDED libmpv after normalize:"
          objdump -p "$BUNDLE"/libmedia_kit_video_plugin.so "$BUNDLE"/libmedia_kit_native_event_loop.so | grep "NEEDED.*libmpv"
          if objdump -p "$BUNDLE"/libmedia_kit_video_plugin.so "$BUNDLE"/libmedia_kit_native_event_loop.so | grep -q "NEEDED.*libmpv.so.1"; then
            echo "::error::libmpv.so.1 linkage survived normalization"
            exit 1
          fi

      # Advisory runtime dependency audit. Runs AFTER the libmpv
      # normalization above so the reported NEEDED set is what actually
      # ships (.so.2, not .so.1). `ldd` every ELF object in the bundle,
      # collect unresolved DT_NEEDED entries, dedupe them, and surface
      # the list in the job log, the step summary and ::warning::
      # annotations. This is the check that would have caught the
      # agent.2 Arch package shipping without `keybinder` and dying at
      # launch with "error while loading shared libraries:
      # libkeybinder-3.0.so.0".
      #
      # Deliberately NON-FATAL. The runner is Ubuntu 22.04, so entries
      # that 22.04 does not ship but the target distros do (libmpv.so.2
      # itself, for one) come back "not found" here; failing the job on
      # the host's own gaps would block every release for a
      # distro-difference, not a real defect. Annotate and let a human
      # cross-check names against `overrides.archlinux.depends`.
      #
      # Guarded by `[ -d ]` rather than `set -e` on a glob so a missing
      # bundle skips the audit instead of aborting the build.
      - name: Audit runtime shared library deps
        run: |
          BUNDLE="build/linux/x64/release/bundle"
          if [ ! -d "$BUNDLE" ]; then
            echo "Bundle directory $BUNDLE not present - skipping dep audit."
            exit 0
          fi

          # Glob is deliberately unquoted so an empty lib/ still yields a
          # literal pattern; `[ -e ]` filters it out below.
          for f in "$BUNDLE/lastwave-desktop" "$BUNDLE"/lib/*.so; do
            [ -e "$f" ] || continue
            ldd "$f" 2>/dev/null | awk '/not found/ { print $1 }'
          done | sort -u > /tmp/lastwave-missing-libs.txt

          missing=$(cat /tmp/lastwave-missing-libs.txt)

          {
            echo "### Runtime dependency audit (\`ldd\` \"not found\")"
            echo
            echo "Scanned \`$BUNDLE/lastwave-desktop\` and \`$BUNDLE/lib/*.so\`."
            echo
            if [ -z "$missing" ]; then
              echo "No unresolved shared libraries: every NEEDED entry resolved."
            else
              echo "Unresolved shared libraries (advisory - confirm each has a provider in \`linux/packaging/nfpm.yaml\`):"
              echo
              echo '```'
              echo "$missing"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -z "$missing" ]; then
            echo "Dependency audit: no unresolved shared libraries."
          else
            echo "Dependency audit: unresolved shared libraries (advisory only):"
            echo "$missing"
            echo "$missing" | while IFS= read -r lib; do
              [ -n "$lib" ] || continue
              echo "::warning::unresolved shared library $lib - verify it is declared in linux/packaging/nfpm.yaml"
            done
          fi

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LastWave-Desktop-Linux
          path: build/linux/x64/release/bundle/

      # System packages are release-only (v* tags): PR/push builds
      # stop at the raw bundle above.
      - name: Setup Go (nFPM)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/setup-go@v5
        with:
          go-version: stable

      # nFPM's Arch packager is selected with `--packager archlinux`, NOT
      # `arch`: `nfpm package --help` lists the accepted values as
      # [apk|archlinux|deb|ipk|msix|rpm|srpm], and an unknown value is
      # rejected before any file is written. It emits a `*.pkg.tar.zst`,
      # and `arch: amd64` in nfpm.yaml is mapped to `x86_64` for this
      # packager, hence the x86_64 filename.
      - name: Build deb/rpm/arch packages
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
          export VERSION="${GITHUB_REF_NAME#v}"
          echo "Packaging version $VERSION"

          # --- Arch pkgver: make it increase once per release ----------
          #
          # nFPM builds the Arch pkgver as
          #   fmt.Sprintf("%s-%d", info.Version, pkgrel)
          # (arch/arch.go:293), with pkgrel defaulting to 1 because
          # nfpm.yaml sets no `release:`. nfpm.yaml pins a static
          # `version: ${VERSION}` derived from the tag, and the agent
          # tags only differ AFTER the first dot segment's package
          # identity, so v1.0.0-agent.2 and v1.0.0-agent.3 both produced
          # pkgver 1.0.0-1 and `pacman -U` refused to upgrade:
          #   warning: lastwave-desktop-1.0.0-1 is up to date -- reinstalling
          #
          # There is no clean override to fix this, which is why the
          # config is rewritten into a COPY below:
          #  * `nfpm package` has no --version/--release flag. Its only
          #    flags are --config/-f, --target/-t and --packager/-p
          #    (internal/cmd/package.go).
          #  * `overrides.archlinux.version` is not a thing: the
          #    Overridables struct has no Version/Release field
          #    (nfpm.go:359-375) and the YAML decoder is strict
          #    (dec.KnownFields(true), nfpm.go:88), so an unknown key
          #    there is a hard parse error, not an override. Version is
          #    also merged from Info, not Overridables (nfpm.go:141-154).
          #  * `version: ${ARCH_VERSION}` env expansion does work
          #    (nfpm.go:209) but it is the single top-level version
          #    shared by all packagers, so using it would move deb and
          #    rpm too.
          # The COPY approach keeps deb and rpm byte-identical to before:
          # only the archlinux invocation gets --config of the rewrite.
          #
          # Monotonicity comes from GITHUB_RUN_NUMBER (a per-run counter
          # of THIS workflow), not from comparing tag strings, so it does
          # not depend on lexically sorting tags. pacman's vercmp compares
          # dot-separated numeric segments numerically, so run 10 > run 9
          # (1.0.0.agent.4.10-1 > 1.0.0.agent.4.9-1) and ordering is
          # never affected by the tag's own segment widths.
          #
          # Legal pkgver: no whitespace, no "/", and no "-" in the
          # version part (a hyphen would make pacman split pkgver/pkgrel
          # wrongly; nFPM appends its own "-<release>"). The tag is
          # sanitised in shell, never by hand: only [a-z0-9._] survives,
          # so v1.0.0-agent.4 becomes 1.0.0.agent.4 rather than the
          # illegal 1.0.0-agent.4.
          sanitise_tag() {
            printf '%s' "${1#v}" \
              | tr 'A-Z' 'a-z' \
              | tr -c 'a-z0-9._' '.' \
              | sed -e 's/\.\{2,\}/./g' -e 's/^\.*//' -e 's/\.*$//'
          }
          ARCH_BASE="$(sanitise_tag "$GITHUB_REF_NAME")"
          # A tag made only of illegal characters leaves nothing behind.
          [ -n "$ARCH_BASE" ] || ARCH_BASE="0.0.0"
          ARCH_VERSION="${ARCH_BASE}.${GITHUB_RUN_NUMBER}"
          # Fail loudly rather than shipping an un-upgradeable package.
          case "$ARCH_VERSION" in
            *-*|*/*|*" "*|'') echo "::error::illegal Arch version: '$ARCH_VERSION'"; exit 1 ;;
          esac
          echo "Arch pkgver will be ${ARCH_VERSION}-1 (tag ${GITHUB_REF_NAME}, run ${GITHUB_RUN_NUMBER})"
          ARCH_CONFIG="${RUNNER_TEMP}/nfpm-archlinux.yaml"
          # Anchored to column 0 so only the top-level `version:` is
          # rewritten; `version: ${VERSION}` is the sole column-0 match.
          sed "s|^version: .*|version: ${ARCH_VERSION}|" \
            linux/packaging/nfpm.yaml > "$ARCH_CONFIG"
          diff -u linux/packaging/nfpm.yaml "$ARCH_CONFIG" || true
          # ----------------------------------------------------------------

          ~/go/bin/nfpm package --config linux/packaging/nfpm.yaml --packager deb --target ./lastwave-desktop_${VERSION}_amd64.deb
          ~/go/bin/nfpm package --config linux/packaging/nfpm.yaml --packager rpm --target ./lastwave-desktop_${VERSION}_x86_64.rpm
          ~/go/bin/nfpm package --config "$ARCH_CONFIG" --packager archlinux --target ./lastwave-desktop_${VERSION}_x86_64.pkg.tar.zst
          ls -la lastwave-desktop_${VERSION}_amd64.deb lastwave-desktop_${VERSION}_x86_64.rpm lastwave-desktop_${VERSION}_x86_64.pkg.tar.zst

      - name: Upload Linux Packages
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: LastWave-Linux-Packages
          path: |
            lastwave-desktop_*_amd64.deb
            lastwave-desktop_*_x86_64.rpm
            lastwave-desktop_*_x86_64.pkg.tar.zst

  build-windows:
    name: Build Windows Bundle
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Write .env from secrets
        run: echo "ADDON_CLIENT_SECRET=${{ secrets.ADDON_CLIENT_SECRET }}" > .env

      - name: Generate Obfuscated Secrets
        run: dart tool/obfuscate_secrets.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows app
        run: flutter build windows --release

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LastWave-Desktop-Windows
          path: build\windows\x64\runner\Release\

      # The single-file installer is release-only (v* tags): PR/push
      # builds stop at the raw Release folder above.
      - name: Build installer
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $ver = '${{ github.ref_name }}'.TrimStart('v')
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' "/DMyAppVersion=$ver" windows\installer.iss
          Get-ChildItem build\windows\installer\

      - name: Upload Windows Installer
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: LastWave-Windows-Installer
          path: build\windows\installer\*.exe

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      # NOTE: download-artifact `pattern` splits on newlines, NOT
      # commas — a comma-separated pattern matches nothing, dist stays
      # empty, and the release publishes with zero binaries. So each
      # tag artifact is downloaded by exact name (a missing artifact
      # fails its step loudly instead of publishing an empty release).
      # Assets ride the release as raw files: .exe, .deb, .rpm
      # (macOS stays a zip — a bare .app bundle isn't shippable).
      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: LastWave-Windows-Installer
          path: dist

      - name: Download Linux packages
        uses: actions/download-artifact@v4
        with:
          name: LastWave-Linux-Packages
          path: dist

      - name: Download macOS archive
        uses: actions/download-artifact@v4
        with:
          name: LastWave-Desktop-macOS
          path: dist

      - name: List release files
        run: find dist -type f

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          generate_release_notes: true
          fail_on_unmatched_files: true

  # macOS ships as a plain zip archive: no installer (unsigned macOS
  # zips Gatekeeper-block on other Macs — see release notes — but the
  # archive rides along on the Release for anyone who wants it.
  build-macos:
    name: Build macOS Bundle
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Write .env from secrets
        run: echo "ADDON_CLIENT_SECRET=${{ secrets.ADDON_CLIENT_SECRET }}" > .env

      - name: Generate Obfuscated Secrets
        run: dart tool/obfuscate_secrets.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Build macOS app
        run: flutter build macos --release

      - name: Compress macOS Bundle
        run: |
          ditto -c -k --keepParent "build/macos/Build/Products/Release/lastwave_desktop.app" "LastWave-Desktop-macos.zip"

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LastWave-Desktop-macOS
          path: LastWave-Desktop-macos.zip

  # Analyzer + test gate. Kept as its own job (the analyze/test steps in
  # build-linux are commented out) so a broken test fails fast in ~2 min
  # instead of after a full Linux bundle build, and so push/PR feedback
  # exists even when the release jobs are tag-gated.
  analyze-test:
    name: Analyze and Test
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Same toolchain build-linux installs, untrimmed: analyze resolves
      # Linux plugin/build imports and the media_kit package needs
      # libmpv-dev present even for a host-side `flutter test`.
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
          clang cmake ninja-build pkg-config patchelf binutils \
          libgtk-3-dev liblzma-dev libstdc++-12-dev \
          libayatana-appindicator3-dev libasound2-dev libmpv-dev mpv \
          libkeybinder-3.0-dev libwebkit2gtk-4.1-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # lib/core/env/app_env.dart imports the gitignored, generated
      # secrets.g.dart — without it analyze reports a missing-import
      # error and every test importing app_env.dart fails to compile.
      # No .env is written here on purpose: the generated constants stay
      # empty, and the addon tests self-skip on an empty secret, so the
      # gate needs no repo secret. Release builds still inject the real
      # ADDON_CLIENT_SECRET in build-linux.
      - name: Generate Obfuscated Secrets
        run: dart tool/obfuscate_secrets.dart

      - name: Install dependencies
        run: flutter pub get

      # Errors fail the job; warnings/infos are reported but tolerated
      # (--no-fatal-warnings) so lint backlog does not block the gate.
      - name: Analyze
        run: flutter analyze --no-fatal-warnings

      - name: Test
        run: flutter test
